[workspace]
resolver = "2"
members = ["crates/native", "crates/host", "crates/bridge", "crates/dsp"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
libloading = "0.9"
base64 = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
